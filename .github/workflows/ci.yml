name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import flatten"
      - run: python -m pytest -q

      # 커버리지는 sys.monitoring 을 쓰는 인터프리터에서만 잰다.
      # 3.8~3.11 에서는 flatten 의 tracer 가 sys.settrace 로 coverage.py 의 추적
      # 함수를 밀어내므로 측정값이 24.7% 같은 숫자가 되고, 그 게이트는 통과할 수
      # 없다. 3.13 을 매트릭스에 추가할 때 이 목록에도 넣으면 된다.
      # 임계값은 pyproject.toml 의 [tool.coverage.report] fail_under 에 있다
      # (왜 90 이 아니라 82 인지, 무엇을 채우면 올릴 수 있는지 거기 적어 두었다).
      - name: Coverage gate (sys.monitoring interpreters only)
        if: ${{ contains(fromJSON('["3.12", "3.13"]'), matrix.python-version) }}
        run: python -m pytest --cov=flatten --cov-report=term-missing

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build

  wheel-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl --force-reinstall
      - run: python -c "import flatten; print(flatten.__version__)"
      - run: python -m flatten --help

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m flatten --help
      - run: python -m flatten analyze --json
      - run: python -m flatten benchmark --catalog benchmarks/projects.csv

  benchmark-sanity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_benchmarks.py -q
      - run: python -m flatten benchmark --catalog benchmarks/projects.csv --out-json benchmark-summary.json --out-md benchmark-summary.md

  release-gate:
    needs: [lint, typecheck, test, build, wheel-install-smoke, cli-smoke, benchmark-sanity]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - shell: pwsh
        run: ./scripts/release_gate.ps1
