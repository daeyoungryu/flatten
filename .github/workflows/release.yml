name: release-check

# 태그 푸시 시 배포 산출물이 실제로 만들어지고 메타데이터가 유효한지만 확인한다.
# 업로드(twine upload) 단계는 의도적으로 없다 — PyPI 공개는 되돌릴 수 없으므로
# 사람이 승인 후 직접 실행한다. docs/RELEASE_CHECKLIST.md 참조.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Install from the built wheel and import it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import flatten_polymorph; print('import ok')"

      - name: Upload artifacts for manual release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
